<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sewer Run</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; width: 1024px; height: 768px; }
    #loading {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; color: #ccc; font: 16px/1.4 sans-serif;
    }
    #loading .bar { width: 320px; height: 6px; margin-top: 14px; background: #222; overflow: hidden; }
    #loading .bar div { width: 0; height: 100%; background: #8c6cff; transition: width .5s linear; }
  </style>
  <script>
    // The player has no "ready" event, so watch its log for the Flash menu
    // finishing start-up; fall back to hiding the overlay after 40s.
    (function () {
      const hide = () => { const el = document.getElementById('loading'); if (el) el.remove(); };
      const log = console.log;
      console.log = function (...args) {
        if (typeof args[0] === 'string' && args[0].includes('fully ready')) hide();
        return log.apply(this, args);
      };
      setTimeout(hide, 40000);
      // Rough progress: start-up takes ~5s on a typical machine.
      const t0 = Date.now();
      const tick = setInterval(() => {
        const bar = document.querySelector('#loading .bar div');
        if (!bar) return clearInterval(tick);
        bar.style.width = Math.min(95, (Date.now() - t0) / 50) + '%';
      }, 500);
    })();
  </script>
  <script src="dirplayer-polyfill.js"></script>
  <script>
    // Sewer Run's menu SWF never answers the player's ActionScript probe while
    // loading, so the default 3s wait only delays the menu.
    DirPlayer.configureFlash({ asInitWaitMs: 0 });
  </script>
</head>
<body>
  <div id="stage">
    <div id="loading">Loading Sewer Run…<div class="bar"><div></div></div></div>
    <embed src="game.dcr" width="1024" height="768" type="application/x-director">
  </div>
</body>
</html>
